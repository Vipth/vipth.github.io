<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bar Calculator</title>
<link rel="stylesheet" href="style.css" />
</head>

<body>
<div class="container">
  <a class="back-link" href="../../index.html">&larr; All Tools</a>
  <h1>Raw Material Cut Calculator</h1>

  <div class="top-grid">
    <div>
      <label for="rawLength">Raw Material Length (<span class="unit-label">in</span>)</label>
      <input type="number" id="rawLength" value="288" step="0.001">
    </div>

    <div>
      <label for="kerf">Kerf Width (<span class="unit-label">in</span>)</label>
      <input type="number" id="kerf" value="0" step="0.001">
    </div>

    <div>
      <label for="unit">Unit</label>
      <select id="unit" onchange="onUnitChange()">
        <option value="in">Inches (in)</option>
        <option value="ft">Feet (ft)</option>
        <option value="mm">Millimeters (mm)</option>
        <option value="cm">Centimeters (cm)</option>
        <option value="m">Meters (m)</option>
      </select>
    </div>
  </div>

  <div class="toolbar">
    <div class="toolbar-group">
      <label for="presetName">Presets</label>
      <div class="toolbar-row">
        <input type="text" id="presetName" placeholder="Preset name">
        <button class="btn-secondary" onclick="savePreset()">Save Preset</button>
      </div>
      <div class="toolbar-row">
        <select id="presetSelect" onchange="loadPreset()">
          <option value="">Load a preset&hellip;</option>
        </select>
        <button class="btn-danger" onclick="deletePreset()">Delete</button>
      </div>
    </div>

    <div class="toolbar-group">
      <label>Parts CSV</label>
      <div class="toolbar-row">
        <button class="btn-secondary" onclick="exportCsv()">Export CSV</button>
        <button class="btn-secondary" onclick="document.getElementById('csvImport').click()">Import CSV</button>
        <input type="file" id="csvImport" accept=".csv,text/csv" hidden onchange="importCsv(event)">
      </div>
    </div>
  </div>

  <h2>Parts</h2>

  <table id="partsTable">
    <tr>
      <th>Item Number</th>
      <th>Part Length</th>
      <th>Quantity</th>
      <th></th>
    </tr>
  </table>

  <div class="actions">
    <button class="btn-secondary" onclick="addPart()">Add Part</button>
    <button class="btn-secondary" onclick="clearAllParts()">Clear All</button>
    <button class="btn-primary" onclick="calculate()">Calculate</button>
    <button class="btn-secondary" onclick="window.print()">Print / Save PDF</button>
    <button class="btn-secondary" onclick="toggleTheme()" id="themeBtn">☀️ Light Mode</button>
  </div>

  <h2>Results</h2>
  <div id="results"></div>
</div>

<script src="script.js"></script>
</body>
</html>
